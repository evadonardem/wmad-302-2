<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake and Ladders (Bankin, Ivan)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

  <!-- Game JS -->
  <script src="scripts/snake_and_ladders.js" defer></script>

  <style>
    #boardPlaceholder {
      background-image: url('images/board.jpg');
      background-size: cover;
      position: relative;
      width: 740px;
      height: 740px;
    }
    .color-swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.12);
    }
    #dicePlaceholder i { margin-right: 6px; }
    #playerStats { max-height: 300px; overflow-y: auto; }
    .stat-line { margin-bottom: 6px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fa fa-xl fa-gamepad"></i>
        Snake and Ladders Game by LastName, FirstName
      </a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-9">
        <h1>Board</h1>
        <div id="boardPlaceholder">
          <canvas width="740" height="740"></canvas>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card" style="width: 18rem;">
          <div class="card-body">
            <h5 class="card-title">Roll the Dice!</h5>

            <div id="dicePlaceholder" class="mb-2" aria-live="polite"></div>

            <hr>
            <button id="rollDiceButton" class="btn btn-primary mb-2" disabled>Roll Dice</button>

            <!-- Player Stats + Ranking (added) -->
            <div id="playerStats" class="mt-3 small"></div>
            <div id="currentTurn" class="mt-2 fw-semibold"></div>

          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
