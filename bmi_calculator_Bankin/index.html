<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My BMI Calculator (Bankin, Ivan)</title>

  <!-- Bootstrap -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
  />
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />

  <style>
    body {
      background: radial-gradient(circle at center, #0f0f1e, #000);
      color: #fff;
      font-family: "Orbitron", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bmi-card {
      background: rgba(20, 20, 35, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 20px;
      box-shadow: 0 0 25px #00f0ff;
      padding: 30px;
      text-align: center;
      width: 380px;
    }

    .bmi-card h2 {
      color: #00f0ff;
      font-weight: bold;
      text-shadow: 0 0 15px #00f0ff;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
    }
    .form-control:focus {
      box-shadow: 0 0 15px #00f0ff;
    }

    .btn-glow {
      background: #00f0ff;
      border: none;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 15px #00f0ff;
      transition: 0.3s;
    }
    .btn-glow:hover {
      background: #0ff;
      box-shadow: 0 0 25px #00f0ff;
    }

    #resultBox {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px;
      border-radius: 12px;
      text-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>
  <div class="bmi-card">
    <h2><i class="fa-solid fa-heart-pulse"></i> BMI Calculator</h2>
    <div class="mt-3">
      <input type="number" id="height" class="form-control mb-2" placeholder="Enter height (meters)">
      <input type="number" id="weight" class="form-control mb-2" placeholder="Enter weight (kg)">
      <button onclick="calculateBMI()" class="btn btn-glow w-100">
        Calculate BMI
      </button>
    </div>
    <div id="resultBox"></div>
  </div>

  <script src="scripts/bmi.js"></script>
</body>
</html>
