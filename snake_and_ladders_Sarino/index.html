<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake and Ladders (Sarino, Bryan)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- JS -->
  <script src="scripts/snake_and_ladders.js" defer></script>

  <style>
    #boardPlaceholder {
      background-image: url('images/board.jpg');
      background-size: cover;
      position: relative;
      width: 740px;
      height: 740px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fa fa-xl fa-gamepad"></i>
        Snake and Ladders Game by Sarino, Bryan
      </a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-9">
        <h1>Board</h1>
        <div id="boardPlaceholder">
          <canvas width="740" height="740"></canvas>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card" style="width: 18rem;">
          <div class="card-body">
            <h5 class="card-title">Roll the Dice!</h5>
            <div id="dicePlaceholder"></div>
            <hr>

            <!-- Input for player name -->
            <input type="text" id="playerNameInput" class="form-control mb-2" placeholder="Enter player name">

            <button id="rollDiceButton" class="btn btn-primary mb-2">Roll Dice</button>

            <button id="addPlayerButton" class="btn btn-success mb-2">Add Player</button>


            <hr>
            <h6>Players</h6>
            <ul id="playerList" class="list-group mb-3"></ul>

            <button id="resetButton" class="btn btn-warning w-100">Restart Game</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
